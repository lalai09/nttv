<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Nối Từ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#13111d; --surface:#1d1a2c; --surface2:#27233b; --line:#363150;
  --text:#f5efe3; --muted:#aaa3c0;
  --tile:#f3e9d2; --tile-ink:#1b1730;
  --dead:#ff7b8e; --trap:#ffb04a; --ok:#5fe3c8; --risk-trap:#f2dc5d; --risk-dead:#b8a4ff;
  --good:#6ee7a0; --warn:#ffc94d; --bad:#ff7b8e;
  --ui:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Bricolage Grotesque','Be Vietnam Pro',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  background:var(--ink);color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.45;
  font-variant-numeric:tabular-nums;color-scheme:dark;
  padding:max(12px,env(safe-area-inset-top)) 0 max(28px,env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
#app{width:100%;max-width:520px;margin:0 auto;padding:0 14px;display:flex;flex-direction:column;gap:12px}

/* ===== Thanh trên ===== */
#top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 10px;padding:4px 2px}
#mode{display:flex;align-items:center;gap:10px;min-width:0}
#wd-dot{width:10px;height:10px;border-radius:50%;background:var(--good);flex:none}
#wd-dot.off{background:var(--bad)}
#wd-title{margin:0;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.01em;line-height:1.1}
#wd-status{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
#wd-status.ok::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px}
#wd-status.err{color:var(--bad)}

/* ===== Công tắc ===== */
#toggles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tg{
  display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 6px;min-width:0;
  border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s;
}
.tg::before{content:'';flex:none;width:30px;height:18px;border-radius:9px;background:var(--line);
  background-image:radial-gradient(circle at 9px 9px,var(--muted) 6px,transparent 6.5px);transition:background .15s}
.tg[aria-pressed="true"]{color:var(--text);border-color:var(--ok);background:rgba(95,227,200,.1)}
.tg[aria-pressed="true"]::before{background-color:var(--ok);background-image:radial-gradient(circle at 21px 9px,var(--ink) 6px,transparent 6.5px)}
.tg.blocked{border-color:var(--warn);background:rgba(255,201,77,.12);color:var(--warn)}
.tg.blocked::before{background-color:var(--warn);background-image:radial-gradient(circle at 21px 9px,var(--ink) 6px,transparent 6.5px)}
.tg:active{transform:scale(.97)}
.tg.act::before{display:none}
.tg:disabled{opacity:.45}

/* ===== Thành phần chung ===== */
.view{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.lbl-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2.sec{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--muted)}
.empty{padding:14px 4px;color:var(--muted);font-size:15px;text-align:center}
.empty.err{color:var(--bad)}
.banner{border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700}
.banner.ok{background:rgba(110,231,160,.13);color:var(--good)}
.banner.warn{background:rgba(255,201,77,.13);color:var(--warn)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:13px;font-weight:600;color:var(--muted);background:var(--surface2);border-radius:8px;padding:3px 9px}

/* ===== Từ hiện tại ===== */
#wd-count{display:flex;gap:12px;font-size:13px;font-weight:700}
#wd-count .me{color:var(--good)} #wd-count .opp{color:var(--dead)}
#wd-original{margin-top:4px;font-family:var(--display);font-weight:800;font-size:clamp(26px,8.5vw,36px);line-height:1.15;word-break:break-word}

/* ===== Đáp án chính: viên chữ ===== */
.tile,#wd-ai-row{
  --k:var(--ok);
  display:block;width:100%;text-align:left;position:relative;
  background:var(--tile);color:var(--tile-ink);border-radius:18px;padding:14px 18px 16px;
  border-bottom:7px solid var(--k);box-shadow:0 10px 0 -4px rgba(0,0,0,.35);
}
.tile.k-dead,#wd-ai-row.k-dead{--k:var(--dead)} .tile.k-trap,#wd-ai-row.k-trap{--k:var(--trap)}
.tile.k-ok,#wd-ai-row.k-ok{--k:var(--ok)} .tile.k-risk-trap,#wd-ai-row.k-risk-trap{--k:var(--risk-trap)}
.tile.k-risk-dead,#wd-ai-row.k-risk-dead{--k:var(--risk-dead)}
.tile .lbl,#wd-ai-row .lbl{color:#5a5470}
.tile-word,#wd-ai-best{
  display:block;font-family:var(--display);font-weight:800;font-size:clamp(38px,13vw,58px);line-height:1.05;
  letter-spacing:-.02em;margin:2px 0 4px;word-break:break-word;color:var(--tile-ink);
}
#wd-ai-best{cursor:pointer;background:none;border:0;padding:0;text-align:left;width:100%}
.tile-hint,#wd-why{font-size:14px;font-weight:600;color:#4a4463;line-height:1.4}
#wd-ai-reason{display:inline-flex;align-items:center;font-size:13px;font-weight:800;background:var(--k);color:#1b1730;border-radius:8px;padding:2px 10px}
.tile:active,#wd-ai-row:active{transform:translateY(2px);box-shadow:0 6px 0 -4px rgba(0,0,0,.35)}
.tile.guess{border-bottom-style:dashed}
.tile.active,#wd-ai-row.wd-picked{background:#c9f3dc}
.tile.wrong{background:#ffd3d9;--k:#e0314b}
#wd-ai-row.pop,.tile.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.97)}to{transform:scale(1)}}

/* ===== Chip từ ===== */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  --k:var(--ok);min-height:44px;padding:0 16px 0 14px;border-radius:12px;background:var(--surface);
  border:1.5px solid var(--line);border-left:5px solid var(--k);font-size:17px;font-weight:700;color:var(--text);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.chip:active{transform:scale(.95)}
.chip i{font-style:normal;font-weight:600;font-size:13px;color:var(--muted)}
.chip.k-dead{--k:var(--dead)} .chip.k-trap{--k:var(--trap)} .chip.k-ok{--k:var(--ok)}
.chip.k-risk-trap{--k:var(--risk-trap)} .chip.k-risk-dead{--k:var(--risk-dead)}
.chip.dim{border-style:dashed;color:var(--muted)}
.chip.active{background:rgba(110,231,160,.18);border-color:var(--good)}
.chip.picked{background:#1c5a43;border-color:var(--good)}
.chip .mk{font-size:14px;color:var(--k)}
#wd-ai-alt:empty{display:none}
#wd-suggest{
  display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:max-content;gap:8px;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x;scrollbar-width:none;padding:1px 0 3px;
}
#wd-suggest::-webkit-scrollbar{display:none}
#wd-suggest .empty{grid-row:1 / span 2;white-space:nowrap;text-align:left;align-self:center}
.scroll{max-height:340px;overflow-y:auto;scrollbar-width:thin}

/* ===== Chú giải ===== */
#wd-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted);font-weight:600}
.lg{display:flex;align-items:center;gap:6px}
.lg b{width:12px;height:12px;border-radius:4px;flex:none}

/* ===== Lịch sử ===== */
.hist-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hist-head .sec{margin:0}
#wd-hist{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:9px 12px;min-height:52px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px}
#wd-hist::-webkit-scrollbar{display:none}
.wd-h{flex:none;padding:5px 11px;border-radius:999px;background:var(--surface2);font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.wd-h.me{background:rgba(110,231,160,.15);color:var(--good)}
.wd-h.last{color:var(--text);box-shadow:inset 0 0 0 1.5px currentColor}
.wd-h.me.last{color:var(--good)}
.wd-sep{flex:none;font-style:normal;font-weight:700;color:var(--line)}
.wd-empty{font-size:14px;font-weight:600;color:var(--muted);padding:0 4px}
  .hint{margin:8px 2px 0;font-size:13px;color:var(--muted)}
.chip.unk{--k:var(--warn)}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn-row button{flex:1;min-height:44px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;font-size:14px}
.btn-row button:active{background:var(--surface2)}
#wd-clear{min-height:44px;margin-right:-10px;padding:0 10px;border-radius:12px;font-weight:700;font-size:13px;color:var(--dead)}
#wd-clear:active{background:rgba(255,123,142,.12)}

/* ===== Giải đố ===== */
.q-head{font-size:19px;font-weight:700;line-height:1.35;word-break:break-word}
.q-off{align-self:flex-start;min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;font-size:14px}
.q-note{font-size:14px;color:var(--muted);font-weight:600}

/* ===== Gom Từ ===== */
#wd-gom-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g-cell{display:flex;align-items:center;justify-content:center;min-height:58px;border-radius:14px;background:var(--tile);color:var(--tile-ink);
  font-family:var(--display);font-weight:800;font-size:24px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.g-cell:empty{background:var(--surface);box-shadow:none;border:1.5px dashed var(--line)}

/* ===== Phòng ===== */
#room{display:flex;align-items:center;gap:1px;flex:none;height:34px;padding:0 11px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);color:var(--muted);font-weight:700;cursor:text}
#room:focus-within{border-color:var(--warn)}
#code-in{width:6ch;min-width:3ch;max-width:14ch;border:0;background:none;color:var(--text);padding:0;font:inherit;font-size:16px;font-weight:600;outline:0}
#code-in::placeholder{color:var(--muted);opacity:.6}

#wd-preview{
  position:fixed;z-index:1000;display:none;max-width:260px;max-height:260px;overflow-y:auto;
  background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;
  box-shadow:0 16px 36px rgba(0,0,0,.6);line-height:1.55;
}
/* ===== Bảng các từ nối tiếp ===== */
#wd-sheet{position:fixed;inset:0;z-index:1000;background:rgba(5,4,10,.6);display:flex;align-items:flex-end;justify-content:center}
#sheet-card{width:100%;max-width:520px;max-height:78vh;display:flex;flex-direction:column;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
  padding:16px 16px max(16px,env(safe-area-inset-bottom))}
#sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#sheet-title{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.15;word-break:break-word}
#sheet-x{flex:none;width:44px;height:44px;border-radius:12px;background:var(--surface2);font-size:18px;font-weight:700}
#sheet-body{overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:60px}
.sg{--k:var(--ok)}
.sg.k-dead{--k:var(--dead)} .sg.k-trap{--k:var(--trap)} .sg.k-risk-trap{--k:var(--risk-trap)} .sg.k-risk-dead{--k:var(--risk-dead)}
.sg-t{font-size:14px;font-weight:800;color:var(--k);margin-bottom:6px}
.sg-w{display:flex;flex-wrap:wrap;gap:6px}
.sw{padding:5px 11px 5px 9px;border-radius:9px;background:var(--surface2);border-left:4px solid var(--k);font-size:16px;font-weight:700}
#sheet-pick{min-height:50px;border-radius:14px;background:var(--tile);color:var(--tile-ink);font-weight:800;font-size:16px}
#sheet-pick:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app">
  <header id="top">
    <div id="mode"><span id="wd-dot" class="off" title="Kết nối với userscript"></span><h1 id="wd-title">Nối Từ</h1>
      <label id="room" title="Mã phòng (phải trùng với userscript)">#<input id="code-in" placeholder="phong1" aria-label="Mã phòng, phải trùng với userscript" autocapitalize="off" autocomplete="off" spellcheck="false" maxlength="30"></label>
    </div>
    <div id="wd-status">Đang tải…</div>
  </header>

  <div id="toggles" role="group" aria-label="Đọc từ nên dùng">
    <button id="wd-speak" class="tg" type="button" aria-pressed="false">Đọc to</button>
    <button id="wd-say" class="tg act" type="button">Nghe lại</button>
  </div>

  <!-- Giải đố -->
  <section id="wd-q" class="view" hidden></section>

  <!-- Nối Từ -->
  <section id="wd-body-assist" class="view">
    <div class="card">
      <div class="lbl-row">
        <span class="lbl">Từ hiện tại</span>
        <span id="wd-count"><span class="me">Bạn <b id="wd-my-n">0</b></span><span class="opp">Đối thủ <b id="wd-opp-n">0</b></span></span>
      </div>
      <div id="wd-original">Chờ từ...</div>
    </div>

    <div id="wd-ai-row" class="k-ok">
      <div class="lbl-row"><span id="wd-ai-label" class="lbl">Nên nối</span><span id="wd-ai-reason"></span></div>
      <button id="wd-ai-best" type="button">…</button>
      <div id="wd-why"></div>
    </div>

    <div id="wd-alt-wrap" hidden>
      <h2 class="sec">Lựa chọn khác (điểm càng cao càng tốt)</h2>
      <div id="wd-ai-alt" class="chips"></div>
    </div>

    <div>
      <h2 class="sec">Các từ có thể nối</h2>
      <div id="wd-suggest" class="chips"><div class="empty">Chờ từ...</div></div>
      <div id="wd-legend">
        <span class="lg"><b style="background:var(--dead)"></b>Cụt: đối thủ hết đường</span>
        <span class="lg"><b style="background:var(--trap)"></b>Bẫy</span>
        <span class="lg"><b style="background:var(--ok)"></b>Thường</span>
        <span class="lg"><b style="background:var(--risk-trap)"></b>Nên tránh</span>
      </div>
    </div>

    <div>
      <div class="hist-head">
        <h2 class="sec">Lịch sử <span id="wd-hist-n"></span></h2>
        <button id="wd-clear" type="button" title="Xóa lịch sử và từ đã dùng">Xóa hết</button>
      </div>
      <div id="wd-hist"></div>
    </div>

    <div>
      <h2 class="sec">Từ chưa có trong kho <span id="wd-unk-n"></span></h2>
      <div id="wd-unk" class="chips scroll"></div>
      <p class="hint">Bấm vào một từ để thêm vào kho.</p>
      <div id="wd-unk-btns" class="btn-row" hidden>
        <button id="wd-unk-copy" type="button">Chép cả danh sách</button>
        <button id="wd-unk-clear" type="button">Xóa danh sách</button>
      </div>
    </div>
  </section>

</main>
<div id="wd-sheet" hidden>
  <div id="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div id="sheet-head">
      <div><div class="lbl">Các từ nối tiếp sau</div><div id="sheet-title"></div></div>
      <button id="sheet-x" type="button" aria-label="Đóng">✕</button>
    </div>
    <div id="sheet-body"></div>
    <button id="sheet-pick" type="button">Chọn từ này</button>
  </div>
</div>

<script>
const DB = "https://khotu-fc3e7-default-rtdb.asia-southeast1.firebasedatabase.app";
const $ = id => document.getElementById(id);
const norm = w => (w || '').trim().toLowerCase().replace(/\s+/g, ' ').normalize('NFC');
// Chuẩn hóa vị trí dấu thanh: hoà = hòa, thuý = thúy
const canonSyl = s => { let tone = ''; const b = (s || '').toLowerCase().normalize('NFD').replace(/[\u0300\u0301\u0303\u0309\u0323]/g, m => { tone = m; return ''; }).normalize('NFC'); return b + tone; };
const canonW = w => w.split(' ').map(canonSyl).join(' ');
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

// ===== Mã phòng =====
let code = new URLSearchParams(location.search).get('code') || lsGet('wd_live_code', 'phong1');
$('code-in').value = code;
const fitCode = () => { $('code-in').style.width = Math.min(14, Math.max(4, $('code-in').value.length + 1)) + 'ch'; };
fitCode();
$('code-in').oninput = fitCode;
$('code-in').onkeydown = e => { if (e.key === 'Enter') e.target.blur(); };
$('code-in').onchange = () => {
  code = $('code-in').value.trim() || 'phong1'; lsSet('wd_live_code', code);
  $('code-in').value = code; fitCode();
  lastT = 0; lastClearT = null; qJson = ''; pollQ();
};

// ===== Kho từ =====
const byFirst = new Map(), trapSet = new Set();
let wordSet = new Set(), canonSet = new Set();
let dictReady = false, totalWords = 0;
function setStatus() {
  const el = $('wd-status');
  el.style.color = '';
  if (dictReady) { el.className = 'ok'; el.textContent = 'Kho ' + totalWords.toLocaleString('vi-VN') + ' từ'; }
  else { el.className = 'err'; el.textContent = 'Lỗi tải kho từ'; }
}
function loadWords() {
  fetch(DB + '/words.json').then(r => r.json()).then(data => {
    byFirst.clear(); trapSet.clear();
    const seen = new Set();
    for (const e of (data ? Object.values(data) : [])) {
      const w = typeof e === 'string' ? e : e && e.w;
      if (!w) continue;
      const n = norm(w), p = n.split(' ');
      if (p.length !== 2 || seen.has(n)) continue;
      seen.add(n);
      if (e && e.trap) trapSet.add(n);
      if (!byFirst.has(p[0])) byFirst.set(p[0], []);
      byFirst.get(p[0]).push(n);
    }
    totalWords = seen.size; dictReady = true; setStatus();
    wordSet = seen; canonSet = new Set(Array.from(seen, canonW));
    pendingUnk.splice(0).forEach(noteUnknown);
    pruneUnknown();
    if (curWord) render();
  }).catch(() => { dictReady = false; setStatus(); });
}
loadWords(); setInterval(loadWords, 15000);
function toast(msg, col) {
  const st = $('wd-status'); st.className = ''; st.textContent = msg; st.style.color = col || 'var(--good)';
  clearTimeout(toast.t); toast.t = setTimeout(setStatus, 1400);
}

// ===== Đọc to từ nên dùng (giọng tiếng Việt của máy) =====
const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let speakOn = canSpeak && lsGet('wd_speak', '0') === '1';
let viVoice = null, lastSayText = '', lastSayKey = '';
function pickVoice() {
  if (!canSpeak) return;
  const vs = speechSynthesis.getVoices();
  viVoice = vs.find(v => /^vi([-_]|$)/i.test(v.lang)) || null;
}
if (canSpeak) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text) {
  if (!canSpeak || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'vi-VN'; u.rate = 0.95;
    if (viVoice) u.voice = viVoice;
    speechSynthesis.speak(u);
  } catch (e) {}
}
// đọc khi gợi ý đổi (key giống lần trước thì không đọc lại)
function say(text, key) {
  lastSayText = text;
  if (!speakOn || key === lastSayKey) { if (key !== lastSayKey) lastSayKey = key; return; }
  lastSayKey = key;
  speak(text);
}

  b.setAttribute('aria-pressed', speakOn);
  if (!canSpeak) { b.disabled = true; $('wd-say').disabled = true; b.title = 'Trình duyệt này không hỗ trợ đọc to'; }
}

let qState = null, qJson = '';
async function copyText(t) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(t); return true; } } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0;left:0;top:0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
function applyView() {
  const v = qState && qState.type === 'q' ? 'q' : 'nv';
  $('wd-body-assist').hidden = v !== 'nv';

function renderQ(s) {
  const raw = s.words || [];
  let items = raw.map((w, i) => ({ w, dim: !!(s.dimF && s.dimF[i]), kind: (s.kinds && s.kinds[i]) || 'ok' }));
  const isGl = s.kind === 'gl';
  const meta = [];
  if (s.tag) meta.push(esc(s.tag));
  if (s.guess) meta.push('đoán ngoài kho');
  if (s.kind === 'nv' && s.total) meta.push(s.total + ' từ nối được');
  else if (s.total && s.total > raw.length) meta.push('còn ' + s.total + ' từ khớp');
  if (s.mode === 'dung') meta.push('chọn từ đúng');
  if (s.note) meta.push(esc(s.note));

  let h = `<div class="card"><div class="q-head">${esc(s.head)}</div>`;
  if (meta.length) h += `<div class="pills">${meta.map(m => `<span class="pill">${m}</span>`).join('')}</div>`;
  h += '</div>';
  if (s.warn) h += `<div class="banner warn">${esc(s.warn)}</div>`;
  if (s.copy) h += `<div class="banner ok">${esc(s.copy)}</div>`;

  if (!items.length) {
    if (!s.warn) h += `<div class="empty">${esc(s.emptyMsg || 'Chưa có gợi ý')}</div>`;
  } else {
    const t = items[0];
    let cls = 'tile k-' + t.kind, hint = 'Chạm để chép';
    if (t.dim) cls += ' guess';
    if (isGl) hint = 'Chạm các ô trên game theo thứ tự chữ này · chạm đây để chép';
    if (t.dim && !isGl) hint = 'Đoán ngoài kho · chạm để chép';
    h += `<button type="button" class="${cls}" data-act="copy" data-w="${esc(t.w)}">
      <span class="lbl">${s.kind === 'sp' ? 'Đáp án đúng' : 'Gợi ý số 1'}</span>
      <span class="tile-word">${esc(t.w)}</span><span class="tile-hint">${hint}</span></button>`;
    if (items.length > 1) {
      h += '<div><h2 class="sec">Gợi ý khác</h2><div class="chips scroll">' + items.slice(1).map(x => {
        let c = 'chip k-' + x.kind + (x.dim ? ' dim' : '');
        return `<button type="button" class="${c}" data-act="copy" data-w="${esc(x.w)}">${esc(x.w)}</button>`;
      }).join('') + '</div></div>';
    }
  }
  $('wd-q').innerHTML = h;
  if (items.length) say(items[0].w, 'q|' + s.head + '|' + items[0].w);
  const tl = $('wd-q').querySelector('.tile');
  if (tl && renderQ.last !== s.head + '|' + (items[0] && items[0].w)) { tl.classList.add('pop'); }
  renderQ.last = s.head + '|' + (items[0] && items[0].w);
}
$('wd-q').onclick = e => {

// ===== Kiểm tra định dạng tiếng Việt: âm tiết = [phụ âm đầu] + nguyên âm + [phụ âm cuối] + tối đa 1 dấu thanh =====
const VN_INIT = ['ngh','ng','nh','ch','gh','gi','kh','ph','th','tr','qu','b','c','d','đ','g','h','k','l','m','n','p','r','s','t','v','x',''];
const VN_FIN = ['ng','nh','ch','c','m','n','p','t',''];
const VN_NUC = new Set(('a ă â e ê i o ô ơ u ư y ai ao au ay âu ây eo êu ia iê iu oa oă oe oi ôi ơi ua uâ uê ui uô uơ uy ưa ưi ươ ưu yê oo ' +
  'iêu yêu oai oay oeo uây uôi ươi ươu uyê uya uyu').split(' '));
function isVnSyl(syl) {
  let tone = '', cnt = 0;
  const base = (syl || '').toLowerCase().normalize('NFD')
    .replace(/[\u0300\u0301\u0303\u0309\u0323]/g, m => { tone = m; cnt++; return ''; }).normalize('NFC');
  if (cnt > 1 || !base) return false;
  for (const ini of VN_INIT) {
    if (!base.startsWith(ini)) continue;
    const rest = base.slice(ini.length);
    for (const fin of VN_FIN) {
      if (fin && !rest.endsWith(fin)) continue;
      const nuc = fin ? rest.slice(0, -fin.length) : rest;
      if (!VN_NUC.has(nuc)) continue;
      const f = nuc[0];
      if ((ini === 'k' || ini === 'gh' || ini === 'ngh') && !/[ieêy]/.test(f)) continue;          // k/gh/ngh chỉ đứng trước i, e, ê, y
      if ((ini === 'c' || ini === 'g' || ini === 'ng') && /[ieêy]/.test(f) && !(ini === 'g' && nuc === 'i')) continue;  // c/g/ng không đứng trước i, e, ê, y
      if ((fin === 'c' || fin === 'ch' || fin === 'p' || fin === 't') && tone !== '\u0301' && tone !== '\u0323') continue;  // đuôi c/ch/p/t chỉ có dấu sắc hoặc nặng
      return true;
    }
  }
  return false;
}
const isVnWord = n => { const p = (n || '').split(' '); return p.length === 2 && p.every(isVnSyl); };

// Từ nối tiếp = âm tiết đầu của từ mới trùng âm tiết cuối của từ trước đó
const isChain = (prev, n) => {
  const a = norm(prev).split(' '), b = n.split(' ');
  return a.length === 2 && b.length === 2 && canonSyl(a[1]) === canonSyl(b[0]);
};
let anchor = '';   // từ nối tiếp gần nhất đã được chấp nhận
function onWord(w) {
  const n = norm(w), valid = isVnWord(n);   // đúng 2 âm tiết và đúng định dạng tiếng Việt
  // đối chiếu với từ gần nhất đã nhận VÀ từ đang hiện, để một lần đọc nhầm không làm hỏng chuỗi
  const chain = valid && !!anchor && (isChain(anchor, n) || (curWord && isChain(curWord, n)));
  const start = valid && !anchor;   // chưa có mốc (đầu ván / sau khi xóa) thì từ hợp lệ đầu tiên làm mốc
  curWord = w;
  if (chain || start) anchor = n;
  if (chain) {                      // chỉ từ nối tiếp mới tính là đã dùng
    used.add(n);
    if (!mine.has(n)) opp.add(n);
  }
  if (chain || start) noteUnknown(n);
  if (chain || start) {              // từ không nối tiếp thì không vào lịch sử
    hist.push({ w, n, me: mine.has(n) });
    // chỉ giữ đoạn chuỗi liền mạch ở cuối: từ phía trước mà không nối với từ sau thì bỏ
    let k = hist.length - 1;
    while (k > 0 && isChain(hist[k - 1].n, hist[k].n)) k--;
    hist = hist.slice(Math.max(k, hist.length - 30));
  }
  updCnt(); renderHist();
  $('wd-original').textContent = w;
  hidePreview();
  render();
  if (navigator.vibrate) try { navigator.vibrate(30); } catch (e) {}
}

// ===== Từ phát hiện được mà chưa có trong kho (lưu trong trình duyệt, không tự đẩy lên kho) =====
const UNK_KEY = 'wd_unknown';
let unknown = [];
try { unknown = JSON.parse(lsGet(UNK_KEY, '[]')) || []; } catch (e) { unknown = []; }
unknown = unknown.filter(u => u && isVnWord(u.w));   // bỏ các từ sai định dạng đã lưu từ trước
const pendingUnk = [];
const knownWord = n => wordSet.has(n) || canonSet.has(canonW(n));
function saveUnknown() { lsSet(UNK_KEY, JSON.stringify(unknown.slice(0, 500))); }
function noteUnknown(n) {
  if (!dictReady) { pendingUnk.push(n); return; }
  if (knownWord(n) || unknown.some(u => u.w === n)) return;
  unknown.unshift({ w: n, t: Date.now() });
  saveUnknown(); renderUnknown();
}
function pruneUnknown() {          // kho vừa cập nhật có từ đó rồi thì bỏ khỏi danh sách
  const before = unknown.length;
  unknown = unknown.filter(u => !knownWord(u.w));
  if (unknown.length !== before) saveUnknown();
  renderUnknown();
}
function renderUnknown() {
  $('wd-unk-n').textContent = unknown.length ? '(' + unknown.length + ')' : '';
  $('wd-unk').innerHTML = unknown.length
    ? unknown.map(u => `<button type="button" class="chip unk" data-act="add" data-w="${esc(u.w)}">${esc(u.w)}</button>`).join('')
    : '<div class="empty">Chưa có từ nào ngoài kho</div>';
  $('wd-unk-btns').hidden = !unknown.length;
}
const adding = new Set();
async function addToKho(n) {
  if (adding.has(n)) return;
  if (knownWord(n)) { pruneUnknown(); return; }
  adding.add(n);
  try {
    const r = await fetch(DB + '/words.json', { method: 'POST', body: JSON.stringify({ w: n }) });
    if (!r.ok) throw new Error('http ' + r.status);
  } catch (e) { adding.delete(n); toast('Không thêm được vào kho', 'var(--bad)'); return; }
  adding.delete(n);
  const p = n.split(' ');
  wordSet.add(n); canonSet.add(canonW(n));
  if (!byFirst.has(p[0])) byFirst.set(p[0], []);
  byFirst.get(p[0]).push(n);
  totalWords++;
  unknown = unknown.filter(u => u.w !== n); saveUnknown(); renderUnknown();
  toast('✓ Đã thêm vào kho: ' + n);
  if (curWord) render();
}
$('wd-unk').onclick = e => {
  const el = e.target.closest('[data-act="add"]'); if (!el) return;
  const w = el.dataset.w;
  if (adding.has(w) || !confirm('Thêm “' + w + '” vào kho từ?')) return;
  addToKho(w);
};
$('wd-unk-copy').onclick = () => copyText(unknown.map(u => u.w).join('\n')).then(ok => toast(ok ? '✓ Đã chép ' + unknown.length + ' từ' : 'Không chép được', ok ? 'var(--good)' : 'var(--bad)'));
$('wd-unk-clear').onclick = () => { unknown = []; saveUnknown(); renderUnknown(); toast('Đã xóa danh sách', 'var(--warn)'); };

function renderHist() {
  $('wd-hist-n').textContent = hist.length ? '(' + hist.length + ')' : '';
  $('wd-hist').innerHTML = hist.length
    ? hist.map((h, i) => (i ? '<i class="wd-sep">›</i>' : '') +
        `<span class="wd-h${h.me ? ' me' : ''}${i === hist.length - 1 ? ' last' : ''}">${esc(h.w)}</span>`).join('')
    : '<span class="wd-empty">Chưa có từ nào</span>';
  const hb = $('wd-hist'); hb.scrollLeft = hb.scrollWidth;   // cuộn tới từ mới nhất (bên phải)
}

// ===== AI: negamax + alpha-beta + đào sâu dần =====
const AI_WIN = 1000, BUDGET = 220, TIMEOUT = { t: 1 };
let deadline = 0, nodes = 0;
function avail(ns, ex, u, lim) {
  const l = byFirst.get(ns); if (!l) return 0; let c = 0;
  for (const w of l) if (w !== ex && !u.has(w) && ++c >= lim) return c;
  return c;
}
function opts(word, u) { return (byFirst.get(word.split(' ')[1]) || []).filter(w => w !== word && !u.has(w)); }
function search(word, u, depth, oppMove, alpha, beta) {
  if ((++nodes & 255) === 0 && performance.now() > deadline) throw TIMEOUT;
  const o = opts(word, u);
  if (!o.length) return oppMove ? AI_WIN + depth : -(AI_WIN + depth);
  const info = [];
  for (const w of o) {
    const rc = avail(w.split(' ')[1], w, u, 3);
    if (rc === 0) return oppMove ? -(AI_WIN + depth - 1) : (AI_WIN + depth - 1);
    info.push({ w, rc, t: trapSet.has(w) ? 1 : 0 });
  }
  if (depth <= 0) {
    let tr = 0, near = 0;
    for (const x of info) { if (x.t) tr++; if (x.rc === 1) near++; }
    const adv = Math.min(o.length, 12) * 6 + Math.min(tr, 5) * 12 + Math.min(near, 4) * 20;
    return oppMove ? -adv : adv;
  }
  info.sort((a, b) => (b.t - a.t) || (a.rc - b.rc));
  const n = Math.min(depth >= 3 ? 8 : 6, info.length);
  let b = oppMove ? Infinity : -Infinity;
  for (let i = 0; i < n; i++) {
    const w = info[i].w; u.add(w);
    let s; try { s = search(w, u, depth - 1, !oppMove, alpha, beta); } finally { u.delete(w); }
    if (oppMove) { if (s < b) b = s; if (b < beta) beta = b; }
    else { if (s > b) b = s; if (b > alpha) alpha = b; }
    if (beta <= alpha) break;
  }
  return b;
}
const disp = v => v >= 900 ? 999 : v <= -900 ? -999 : Math.round(v);
const deadEnd = (w, u) => avail(w.split(' ')[1], w, u, 1) === 0;
function risky(w, u) {
  const a = (byFirst.get(w.split(' ')[1]) || []).filter(x => !u.has(x));
  if (!a.length) return null;
  if (a.some(x => deadEnd(x, u))) return 'risk-dead';
  if (a.some(x => trapSet.has(x))) return 'risk-trap';
  return null;
}
function classify(list) {
  const g = { dead: [], trap: [], ok: [], 'risk-trap': [], 'risk-dead': [] };
  for (const w of list) {
    if (trapSet.has(w)) g.trap.push(w);
    else if (deadEnd(w, used)) g.dead.push(w);
    else g[risky(w, used) || 'ok'].push(w);
  }
  return g;
}
function pickDeep(g) {
  const all = [...g.dead, ...g.trap, ...g.ok, ...g['risk-trap'], ...g['risk-dead']];
  if (!all.length) return null;
  const u = new Set(used), deadSet = new Set(g.dead);
  const cands = all.map(w => {
    const on = avail(w.split(' ')[1], w, u, 20), t = trapSet.has(w) ? 1 : 0;
    return { w, bonus: t * 40 + (20 - on) * 4, key: (deadSet.has(w) ? 1000 : 0) + t * 200 - on };
  }).sort((a, b) => b.key - a.key).slice(0, 30);
  deadline = performance.now() + BUDGET; nodes = 0;
  let res = null, reached = 0;
  for (let d = 1; d <= 8; d++) {
    let cur;
    try {
      cur = cands.map(c => {
        u.add(c.w); let raw;
        try { raw = search(c.w, u, d - 1, true, -Infinity, Infinity); } finally { u.delete(c.w); }
        return { w: c.w, raw, bonus: c.bonus };
      });
    } catch (e) { if (e !== TIMEOUT) throw e; break; }
    res = cur; reached = d;
    if (cur.some(r => r.raw >= 900)) break;
  }
  if (!res) { res = cands.map(c => ({ w: c.w, raw: c.bonus, bonus: 0 })); reached = 0; }
  res.forEach(r => r.total = Math.abs(r.raw) >= 900 ? r.raw : r.raw + r.bonus);
  const rk = res.slice().sort((a, b) => b.total - a.total), top = rk[0];
  let kind = 'ok';
  for (const k of ['dead', 'trap', 'risk-trap', 'risk-dead']) if (g[k].includes(top.w)) { kind = k; break; }
  let why;
  if (top.raw >= 900) {
    const plies = reached - (top.raw - AI_WIN), m = Math.max(1, Math.round((plies + 1) / 2));
    if (m <= 1 || kind === 'dead') { kind = 'dead'; why = '✓ Cụt đường ngay — đối thủ hết nước nối'; }
    else { if (kind === 'ok' || kind.startsWith('risk')) kind = 'trap'; why = `★ Thắng ép sau ${m} nước của bạn (sâu ${reached})`; }
  } else if (top.raw <= -900) why = `⚠ Mọi nước đều có thể bị ép thua (sâu ${reached})`;
  else why = `Đã kiểm tra ${reached} lượt, không có đòn ép thua`;
  return { w: top.w, kind, why, score: disp(top.total), alt: rk.slice(1, 4).map(r => ({ w: r.w, s: disp(r.total) })) };
}

// ===== Hiển thị Nối Từ =====
const LABEL = { dead: 'Cụt', trap: 'Bẫy', ok: 'Ổn', 'risk-trap': 'Rủi ro', 'risk-dead': 'Rủi ro' };
const MARK = { dead: '✓', trap: '★', ok: '', 'risk-trap': '✗', 'risk-dead': '✗' };
const chip = (full, kind) =>
  `<button type="button" class="chip k-${kind}" data-full="${esc(full)}">${MARK[kind] ? `<span class="mk">${MARK[kind]}</span>` : ''}${esc(full.split(' ')[1])}</button>`;

function pick(w, el) {
  mine.add(w); opp.delete(w); used.add(w); updCnt();
  if (el) el.classList.add(el.id === 'wd-ai-best' ? 'wd-picked-self' : 'picked');
  if (el && el.id === 'wd-ai-best') $('wd-ai-row').classList.add('wd-picked');
}

let sheetFull = '', sheetEl = null;
function openSheet(full, el) {
  const key = full.split(' ')[1];
  const list = (byFirst.get(key) || []).filter(w => !used.has(w));
  sheetFull = full; sheetEl = el;
  $('sheet-title').textContent = '“' + key + '” · ' + list.length + ' từ';
  const g = classify(list);
  const grp = (arr, k, title) => arr.length
    ? `<div class="sg k-${k}"><div class="sg-t">${title} (${arr.length})</div><div class="sg-w">${arr.map(w => `<span class="sw">${esc(w.split(' ')[1])}</span>`).join('')}</div></div>` : '';
  $('sheet-body').innerHTML = list.length
    ? grp(g.dead, 'dead', '✓ Cụt: đối thủ hết đường') + grp(g.trap, 'trap', '★ Bẫy') + grp(g.ok, 'ok', 'Thường') +
      grp(g['risk-trap'], 'risk-trap', '✗ Nên tránh (dẫn tới bẫy)') + grp(g['risk-dead'], 'risk-dead', '✗ Nên tránh (dẫn tới cụt)')
    : `<div class="empty err">Hết từ nối sau “${esc(key)}”</div>`;
  $('sheet-body').scrollTop = 0;
  $('wd-sheet').hidden = false;
}
const hidePreview = () => { $('wd-sheet').hidden = true; sheetFull = ''; sheetEl = null; };
$('sheet-x').onclick = hidePreview;
$('wd-sheet').onclick = e => { if (e.target === $('wd-sheet')) hidePreview(); };
$('sheet-pick').onclick = () => { if (sheetFull) pick(sheetFull, sheetEl); hidePreview(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') hidePreview(); });

function setAI(best) {
  const row = $('wd-ai-row'), b = $('wd-ai-best'), r = $('wd-ai-reason'), alt = $('wd-ai-alt');
  row.classList.remove('wd-picked'); b.classList.remove('wd-picked-self');
  if (!best) {
    row.className = 'k-ok';
    b.textContent = 'Hết nước đi'; b.onclick = null;
    r.textContent = ''; alt.innerHTML = ''; $('wd-alt-wrap').hidden = true; $('wd-why').textContent = ''; return;
  }
  row.className = 'k-' + best.kind + ' pop';
  b.textContent = best.w.split(' ')[1]; b.title = best.why;
  say(best.w, 'nv|' + curWord + '|' + best.w);   // đọc cả 2 tiếng
  r.textContent = (MARK[best.kind] ? MARK[best.kind] + ' ' : '') + LABEL[best.kind] + ' · ' + best.score;
  $('wd-why').textContent = best.why;
  b.onclick = () => pick(best.w, b);
  $('wd-alt-wrap').hidden = !best.alt.length;
  alt.innerHTML = best.alt.map(a => `<button type="button" class="chip k-ok" data-full="${esc(a.w)}">${esc(a.w.split(' ')[1])}<i>${a.s}</i></button>`).join('');
  alt.querySelectorAll('.chip').forEach(el => el.onclick = () => openSheet(el.dataset.full, el));
}

function render() {
  const box = $('wd-suggest');
  if (!dictReady) { box.innerHTML = '<div class="empty">Đang tải kho từ...</div>'; setAI(null); return; }
  const n = norm(curWord), p = n.split(' ');
  if (p.length !== 2) { box.innerHTML = '<div class="empty">Từ không hợp lệ (cần đúng 2 âm tiết)</div>'; setAI(null); return; }
  const list = (byFirst.get(p[1]) || []).filter(w => w !== n && !used.has(w));
  if (!list.length) { box.innerHTML = `<div class="empty err">Hết từ nối cho “${esc(p[1])}”</div>`; setAI(null); return; }

  const g = classify(list);
  setAI(pickDeep(g));

  const LIM = 14;
  box.innerHTML = ['dead', 'trap', 'ok', 'risk-trap', 'risk-dead'].map(k => g[k].slice(0, LIM).map(w => chip(w, k)).join('')).join('');
  box.querySelectorAll('.chip').forEach(el => { el.onclick = () => openSheet(el.dataset.full, el); });
}

updCnt(); renderHist(); renderUnknown(); setStatus();
</script>
</body>
</html>
